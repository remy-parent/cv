<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0e12" />
    <script>
      // Set the theme before React renders to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f5' : '#0d0e12');
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="Remy Parent — Senior full-stack developer (React, Next.js, TypeScript, Node.js) with a strong back-end e-commerce background (PHP, Magento 2, AWS)."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Remy Parent" />
    <meta property="og:title" content="Remy Parent — Senior Full-stack Developer" />
    <meta
      property="og:description"
      content="Senior full-stack developer (React, Next.js, TypeScript, Node.js) with a strong back-end e-commerce background (PHP, Magento 2, AWS)."
    />
    <meta property="og:url" content="https://cv.remyparent.com" />
    <meta property="og:image" content="https://cv.remyparent.com/og-image.png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:alt" content="Remy Parent — Senior Full-stack Developer" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Remy Parent — Senior Full-stack Developer" />
    <meta
      name="twitter:description"
      content="Senior full-stack developer (React, Next.js, TypeScript, Node.js) with a strong back-end e-commerce background (PHP, Magento 2, AWS)."

    <meta name="twitter:image" content="https://cv.remyparent.com/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
